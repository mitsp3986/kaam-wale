<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaam-Wale | Local Helpers</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-orange-500 rounded-lg flex items-center justify-center text-white font-bold text-xl">K</div>
                <h1 class="text-2xl font-black text-slate-900">Kaam<span class="text-orange-500">-Wale</span></h1>
            </div>
            <div class="hidden md:flex gap-4">
                <button class="px-4 py-2 font-semibold text-slate-700 hover:text-orange-500">User Login</button>
                <button class="px-4 py-2 bg-orange-500 text-white font-semibold rounded-lg shadow-md hover:bg-orange-600">Join as Helper</button>
            </div>
        </div>
    </header>

    <!-- Categories Section -->
    <main class="max-w-7xl mx-auto px-4 py-12">
        <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Top Categories</h2>
        <p class="text-slate-500 mb-8">Aapke aas-paas verified local helpers.</p>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-lg transition-all cursor-pointer">
                <div class="text-orange-500 bg-orange-100 w-12 h-12 flex items-center justify-center rounded-xl mb-4 text-2xl">⚡</div>
                <h3 class="text-xl font-bold text-slate-800">Electrician</h3>
                <p class="text-sm text-slate-500 mt-2">120+ Near You</p>
            </div>
            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-lg transition-all cursor-pointer">
                <div class="text-blue-500 bg-blue-100 w-12 h-12 flex items-center justify-center rounded-xl mb-4 text-2xl">💧</div>
                <h3 class="text-xl font-bold text-slate-800">Plumber</h3>
                <p class="text-sm text-slate-500 mt-2">85+ Near You</p>
            </div>
            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-lg transition-all cursor-pointer">
                <div class="text-green-500 bg-green-100 w-12 h-12 flex items-center justify-center rounded-xl mb-4 text-2xl">🧹</div>
                <h3 class="text-xl font-bold text-slate-800">House Maid</h3>
                <p class="text-sm text-slate-500 mt-2">200+ Near You</p>
            </div>
        </div>
    </main>
</body>
</html>
